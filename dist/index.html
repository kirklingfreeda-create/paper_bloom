<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ece9e2" />
    <title>Paper Bloom</title>
    <meta name="description" content="Click a continuous crumpled paper sculpture to unfold it." />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage">
      <div class="ambient-glow" aria-hidden="true"></div>
      <button class="paper-interaction" type="button" aria-label="展开纸团" aria-pressed="false">
        <span class="ground-shadow" aria-hidden="true"></span>
        <span class="canvas-wrap" aria-hidden="true"></span>
        <span class="hint">CLICK TO UNFOLD</span>
      </button>
    </main>
    <script type="module" src="./script.js"></script>
  </body>
</html>
